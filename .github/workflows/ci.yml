name: CI

on:
  push:
    branches: [master]
  pull_request:

# All third-party actions are pinned to commit SHAs: a moved tag or
# branch must never inject code into this repo's workflows.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty check
        run: uv run ty check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -v --cov=dlt_worker --cov-report=term-missing --cov-report=json

      - name: Upload coverage report
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-json
          path: coverage.json

  # Separate job so the job that executes the test suite (arbitrary
  # project code) never carries write permissions. The badge is built and
  # pushed inline — no third-party action runs with the write token.
  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-json

      - name: Build and push badge to gh-pages
        run: |
          set -euo pipefail
          COV=$(python3 -c 'import json; print(json.load(open("coverage.json"))["totals"]["percent_covered_display"])')
          COLOR=$(python3 -c "print('green' if float('$COV') >= 95 else 'orange')")
          npm i -g badgen-cli
          badgen -j coverage -s "$COV%" -c "$COLOR" > "$RUNNER_TEMP/coverage.svg"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git switch -C gh-pages FETCH_HEAD
          else
            git switch --orphan gh-pages
          fi
          mkdir -p badges
          mv "$RUNNER_TEMP/coverage.svg" badges/coverage.svg
          git add badges/coverage.svg
          if git commit -m 'Update coverage badge [skip ci]'; then
            git push origin gh-pages
          else
            echo "Badge unchanged — nothing to push."
          fi
