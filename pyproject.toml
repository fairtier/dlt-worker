[project]
name = "dlt-worker"
version = "0.12.0"
description = "Worker that runs dlt pipelines from file-based definitions (or the FairTier API) on a schedule"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "dlt[pyiceberg,filesystem,s3,parquet]>=1.5",
    # dlt.sources.filesystem.read_csv parses CSV/TSV via pandas; the dlt
    # filesystem extra does NOT pull it in, so file-drop CSV uploads crash at
    # runtime with ModuleNotFoundError without this explicit dep.
    "pandas>=2",
    "google-auth>=2.35",
    "pyiceberg[pyarrow]>=0.10",
    "requests>=2.32",
    "croniter>=6.0",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    "duckdb>=1.4",
    "pyyaml>=6",
    "pyrage>=1.2",
    "psycopg[binary]>=3.2",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.urls]
Homepage = "https://github.com/fairtier/dlt-worker"
Repository = "https://github.com/fairtier/dlt-worker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_worker"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "ty>=0.0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ty.environment]
extra-paths = ["src", "typings"]

